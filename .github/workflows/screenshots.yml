name: Store screenshots

# Renders the Play Store phone screenshots (StoreScreenshots.kt) and commits
# them to the fastlane metadata folder of the same branch.
on:
  workflow_dispatch:
  push:
    paths:
      - app/src/test/java/org/geekio/floorplanner/StoreScreenshots.kt
      - .github/workflows/screenshots.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Render screenshots
        run: ./gradlew --no-daemon recordPaparazziDebug

      - name: Copy into fastlane metadata
        run: |
          out=fastlane/metadata/android/en-US/images/phoneScreenshots
          rm -rf "$out" && mkdir -p "$out"
          n=1
          for f in $(ls app/src/test/snapshots/images/*.png | sort); do
            cp "$f" "$out/$n.png"; n=$((n + 1))
          done
          ls -la "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: fastlane/metadata/android/en-US/images/phoneScreenshots/*.png

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fastlane/metadata/android/en-US/images/phoneScreenshots
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update Play Store screenshots"
          git push origin HEAD:${GITHUB_REF_NAME}
